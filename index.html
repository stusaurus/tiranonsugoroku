<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3c4">
  <title>ティラノンのあそびば</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="title-screen" class="screen active" aria-labelledby="title-heading">
      <div class="title-art"><span class="sun"></span><span class="title-dino game-piece" aria-hidden="true">🦖</span></div>
      <p class="eyebrow">ティラノンの</p>
      <h1 id="title-heading">あそびば</h1>
      <p class="lead">どっちで あそぶ？</p>
      <button class="mode-card food-mode" data-open="sugoroku-screen">
        <span class="mode-icon">🍖</span><span><b>もうひとくちだノン！</b><small>食べる？ やめる？ ドキドキすごろく</small></span><span class="chevron">›</span>
      </button>
      <button class="mode-card code-mode" data-open="stage-screen">
        <span class="mode-icon">⬆️</span><span><b>ティラノンをうごかそう！</b><small>めいれいを ならべて GOALへ</small></span><span class="chevron">›</span>
      </button>
    </section>

    <section id="sugoroku-screen" class="screen" aria-labelledby="sugoroku-title">
      <header class="game-header"><button class="icon-button" data-title aria-label="タイトルへ">‹</button><div><span class="header-kicker">ドキドキすごろく</span><h2 id="sugoroku-title">もうひとくちだノン！</h2></div><div id="sugoroku-records" class="mini-record"></div></header>
      <div id="sugoroku-board" class="sugoroku-board" aria-label="STARTからGOALまでのすごろく盤"></div>
      <section id="sugoroku-status" class="sugoroku-status" aria-live="polite">
        <div id="food-display" class="food-display">🍽️</div>
        <div class="speech"><b id="sugoroku-message">まずは ひとくち！</b><span id="turn-label">1ターンめ</span></div>
        <div class="risk"><small>今回のパクパク</small><strong id="pending-label">+0</strong><small>マス</small></div>
      </section>
      <div id="streak-label" class="streak-label">あと3回で ボーナス！</div>
      <div class="sugoroku-actions">
        <button id="eat-button" class="primary eat-button"><span>🍴</span>もうひとくち！<small>ピーマンなら今回の分がパー！</small></button>
        <button id="bank-button" class="bank-button" disabled>⭐ ここで ごちそうさま！<small>+0マスを確定</small></button>
      </div>
    </section>

    <section id="stage-screen" class="screen" aria-labelledby="stage-title">
      <header class="game-header simple"><button class="icon-button" data-title aria-label="タイトルへ">‹</button><div><span class="header-kicker">プログラミングモード</span><h2 id="stage-title">ステージを えらぼう！</h2></div></header>
      <div class="howto"><b>① めいれいをならべる</b><span>② うごかしてGOAL！</span></div>
      <div id="stage-grid" class="stage-grid"></div>
    </section>

    <section id="program-screen" class="screen" aria-labelledby="program-title">
      <header class="game-header"><button id="stage-back" class="icon-button" aria-label="ステージ選択へ">‹</button><div><span id="stage-label" class="header-kicker">STAGE 1</span><h2 id="program-title">ティラノンをうごかそう！</h2></div><div id="stage-best" class="mini-record stars">☆☆☆</div></header>
      <div class="mission-row"><span id="stage-mission"></span><b id="optimal-label"></b></div>
      <div id="program-board" class="program-board" aria-label="プログラミング盤"></div>
      <section class="command-panel">
        <div class="command-buttons" aria-label="めいれいボタン">
          <button data-command="forward"><b>⬆️</b><span>すすむ</span></button>
          <button data-command="right"><b>↪️</b><span>みぎ</span></button>
          <button data-command="left"><b>↩️</b><span>ひだり</span></button>
        </div>
        <div class="queue-head"><b>めいれい</b><span id="command-count">0個</span></div>
        <div id="command-list" class="command-list" aria-live="polite"><span class="empty">ボタンを おしてね！</span></div>
        <div class="program-actions"><button id="run-button" class="primary run-button">▶ うごかす！</button><button id="undo-button" class="small-action">↶<span>1個消す</span></button><button id="clear-button" class="small-action">×<span>全部消す</span></button></div>
      </section>
    </section>

    <div id="result-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
      <div class="modal-card"><div id="result-icon" class="result-icon">🎉</div><h2 id="result-title">ついたノーーン！</h2><div id="result-stars" class="result-stars"></div><p id="result-text"></p><button id="result-main" class="primary full">もう一回！</button><button id="result-sub" class="secondary full">ステージをえらぶ</button></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
