<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff3c4"><title>ティラノンのあそびば</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="board-path.css"></head><body><main class="app"><section id="title-screen" class="screen active" aria-labelledby="title-heading"><div class="title-art"><span class="sun"></span><span class="title-dino game-piece" aria-hidden="true">🦖</span></div><p class="eyebrow">ティラノンの</p><h1 id="title-heading">あそびば</h1><p class="lead">どれで あそぶ？</p><a class="mode-card" href="yokubari.html" style="background:linear-gradient(135deg,#ffd65a,#ff9b49);color:inherit;text-decoration:none"><span class="mode-icon">🛤️</span><span><b>よくばりロード NEW!</b><small>左右をえらんで パワーアップ！</small></span><span class="chevron">›</span></a><button class="mode-card food-mode" data-open="sugoroku-screen"><span class="mode-icon">🃏</span><span><b>えらんで進む！すごろく</b><small>3枚のカードで 高得点をねらおう</small></span><span class="chevron">›</span></button><button class="mode-card code-mode" data-open="stage-screen"><span class="mode-icon">⬆️</span><span><b>ティラノンをうごかそう！</b><small>めいれいを ならべて GOALへ</small></span><span class="chevron">›</span></button></section>
<section id="sugoroku-screen" class="screen" aria-labelledby="sugoroku-title"><header class="game-header"><button class="icon-button" data-title aria-label="タイトルへ">‹</button><div><span class="header-kicker">戦略すごろく v0.2</span><h2 id="sugoroku-title">えらんで進む！</h2></div><div id="sugoroku-records" class="mini-record"></div></header><div class="strategy-hud"><b>⭐ <span id="score-label">0</span>点</b><b>⏳ あと<span id="turn-label">12</span>ターン</b><span id="position-label">現在 START</span></div><div class="route-help"><b>太い道</b>をたどってGOALへ。青いマスが分岐！</div><div id="sugoroku-board" class="sugoroku-board"></div><section class="strategy-panel"><div id="sugoroku-message" class="strategy-message"></div><div id="card-hand" class="card-hand"></div><button id="move-button" class="primary move-button" disabled>カードを選んでね</button></section><div id="branch-choice" class="branch-choice" hidden><div><b>↔ どっちへいく？</b><span id="branch-options"></span></div></div></section>
<section id="stage-screen" class="screen"><header class="game-header simple"><button class="icon-button" data-title>‹</button><div><span class="header-kicker">プログラミングモード</span><h2>ステージを えらぼう！</h2></div></header><div class="howto"><b>① めいれいをならべる</b><span>② うごかしてGOAL！</span></div><div id="stage-grid" class="stage-grid"></div></section>
<section id="program-screen" class="screen"><header class="game-header"><button id="stage-back" class="icon-button">‹</button><div><span id="stage-label" class="header-kicker">STAGE 1</span><h2>ティラノンをうごかそう！</h2></div><div id="stage-best" class="mini-record stars">☆☆☆</div></header><div class="mission-row"><span id="stage-mission"></span><b id="optimal-label"></b></div><div id="program-board" class="program-board"></div><section class="command-panel"><div class="command-buttons"><button data-command="forward"><b>⬆️</b><span>すすむ</span></button><button data-command="right"><b>↪️</b><span>みぎ</span></button><button data-command="left"><b>↩️</b><span>ひだり</span></button></div><div class="queue-head"><b>めいれい</b><span id="command-count">0個</span></div><div id="command-list" class="command-list"><span class="empty">ボタンを おしてね！</span></div><div class="program-actions"><button id="run-button" class="primary run-button">▶ うごかす！</button><button id="undo-button" class="small-action">↶<span>1個消す</span></button><button id="clear-button" class="small-action">×<span>全部消す</span></button></div></section></section>
<div id="result-modal" class="modal" role="dialog" aria-modal="true" hidden><div id="confetti" class="confetti"></div><div class="modal-card"><div id="result-icon" class="result-icon">🎉</div><h2 id="result-title">ついたノーーン！</h2><div id="result-stars" class="result-stars"></div><p id="result-text"></p><button id="result-main" class="primary full">もう一回！</button><button id="result-sub" class="secondary full">ステージをえらぶ</button></div></div></main><script src="script.js"></script></body></html>
